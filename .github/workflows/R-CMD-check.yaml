# R CMD check --as-cran with the current CRAN releases of rstan and StanHeaders, on Linux, macOS and Windows.
# Compiling the two Stan models needs several GB of memory and about 15 minutes, so macOS, whose runners have the
# least memory, compiles one file at a time.
on:
  push:
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release', make: '-j2'}
          - {os: ubuntu-latest,  r: 'devel',   make: '-j2', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1', make: '-j2'}
          - {os: windows-latest, r: 'release', make: '-j2'}
          - {os: macos-latest,   r: 'release', make: '-j1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      MAKEFLAGS: ${{ matrix.config.make }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"error"'
          upload-snapshots: true
